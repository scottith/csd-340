<!DOCTYPE html>
<html lang="en">
<!-- Scott Macioce - Assignment 12.2: JavaScript - Part 4 -->
<head>
  <meta charset="UTF-8" />
  <title>CSD 340 Web Development with HTML and CSS</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 20px;
    }

    h1 {
      text-align: center;
    }

    .container {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
    }

    .box {
      border: 2px solid red;
      padding: 20px;
      width: 40%;
      border-radius: 12px;
    }

    .bookList {
      list-style: none;
      padding-left: 0;
      font-weight: bold;
    }

    button {
      margin-right: 10px;
      margin-bottom: 10px;
      padding: 8px 12px;
      font-weight: bold;
    }

    .link {
      margin-top: 50px;
      text-align: center;
    }

    .link a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Assignment 12.2: JavaScript - Part 4</h1>

  <div class="container">
    <div class="box">
      <h3>Top 10 Favorite Books</h3>
      <button onclick="displayTopToBottom()">Top to Bottom</button>
      <button onclick="displayBottomToTop()">Bottom to Top</button>
      <ol id="bookList" class="bookList"></ol>
    </div>

    <div class="box">
      <h3>5 Things I've Learned Since the Course Started</h3>
      <ol type="I">
        <li>HTML structure and semantic tags</li>
        <li>CSS styling and page layout</li>
        <li>JavaScript basics</li>
        <li>DOM manipulation</li>
        <li>Git and version control</li>
      </ol>
    </div>
  </div>

  <div class="link">
    <a href="../index.html">back to Landing Page</a>
  </div>

  <script>
    const books = [
      "The Lord of The Rings",
      "Harry Potter and the Sorceres Stone",
      "Lord of the Flies",
      "Artemis Fowl",
      "The Great Gatsby",
      "The Hobbit",
      "Harry Potter and the Chamber of Secrets",
      "Harry Potter and the Order of The Phoneix",
      "The Godfather",
      "Harry Potter and the Deathly Hallows"
    ];

    function displayTopToBottom() {
      const list = document.getElementById("bookList");
      list.innerHTML = "";
      for (let i = 0; i < books.length; i++) {
        const li = document.createElement("li");
        li.textContent = `${i + 1}. ${books[i]}`;
        list.appendChild(li);
      }
    }

    function displayBottomToTop() {
      const list = document.getElementById("bookList");
      list.innerHTML = "";
      for (let i = books.length - 1, count = 1; i >= 0; i--, count++) {
        const li = document.createElement("li");
        li.textContent = `${count}. ${books[i]}`;
        list.appendChild(li);
      }
    }

    // Optional: Load top-to-bottom by default
    window.onload = displayTopToBottom;
  </script>
</body>
</html>
